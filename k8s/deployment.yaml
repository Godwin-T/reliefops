apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliefops-tracker
  labels:
    app: reliefops-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reliefops-tracker
  template:
    metadata:
      labels:
        app: reliefops-tracker
    spec:
      containers:
        - name: reliefops-tracker
          image: freshinit/reliefops-tracker:sha-a830cbb
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
